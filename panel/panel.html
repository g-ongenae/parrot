<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Parrot</title>
    <link rel="stylesheet" href="../src/theme.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="bar">
      <img class="logo" src="../icons/parrot.svg" alt="" />
      <div class="brand">
        <strong>Parrot</strong>
        <span class="tagline">TL;DL · Too Long, Do Listen</span>
      </div>
      <button id="collapse" class="icon-btn" title="Minimize" aria-label="Minimize">–</button>
      <button id="close" class="icon-btn" title="Close (Esc)" aria-label="Close">×</button>
    </header>

    <div class="source">
      <span id="page-title" class="page-title"></span>
      <span id="selection-badge" class="badge" hidden>Selection</span>
    </div>

    <nav class="tabs" role="tablist">
      <button id="tab-summary" role="tab" data-view="summary">Summary</button>
      <button id="tab-original" role="tab" data-view="original">Original</button>
    </nav>

    <div id="status" class="status" hidden>
      <span class="spinner"></span>
      <span id="status-text"></span>
    </div>
    <div id="error" class="error" hidden>
      <p id="error-text"></p>
      <button id="open-settings" class="link-btn">Open settings</button>
    </div>

    <main id="content" class="content" aria-live="polite"></main>

    <footer class="player">
      <button id="play" class="primary" title="Listen">
        <span id="play-icon">▶</span>
        <span id="play-label">Listen</span>
      </button>
      <button id="stop" class="icon-btn" title="Stop" aria-label="Stop">■</button>
      <select id="rate" title="Speed" aria-label="Speed">
        <option value="0.75">0.75×</option>
        <option value="1">1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option>
        <option value="2">2×</option>
      </select>
      <span class="spacer"></span>
      <span id="usage" class="usage" hidden></span>
      <button id="copy" class="icon-btn" title="Copy text" aria-label="Copy text">⧉</button>
    </footer>

    <script src="../src/settings.js"></script>
    <script src="../src/usage.js"></script>
    <script src="../src/providers.js"></script>
    <script src="../src/speech.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
